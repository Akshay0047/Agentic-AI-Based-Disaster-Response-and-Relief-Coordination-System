[project]
name = "agent-worker-service"
version = "0.1.0"
description = "Agent Worker service (Grok agent + tool executor) for the Disaster Response System"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
services:
  postgres:
    image: postgres:16-alpine
    container_name: drs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drs_password}
      POSTGRES_DB: ${POSTGRES_DB:-disaster_response}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drs} -d ${POSTGRES_DB:-disaster_response}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: